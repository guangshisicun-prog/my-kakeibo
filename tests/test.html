<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家計簿テスト</title>
<style>
  :root { --bg: #fff7f3; --card: #fff; --text: #4a3f3c; --sub: #9a8d89; --ok: #3fa889; --ng: #e86a6a; --line: #f1e4df; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font-family: -apple-system, "Hiragino Sans", sans-serif; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  #summary { font-size: 18px; font-weight: 700; padding: 14px 16px; border-radius: 16px; background: var(--card); margin-bottom: 12px; }
  #summary.ok { color: var(--ok); }
  #summary.ng { color: var(--ng); }
  .group { background: var(--card); border-radius: 16px; padding: 10px 16px; margin-bottom: 12px; }
  .group h2 { font-size: 14px; color: var(--sub); margin: 6px 0; }
  .t { padding: 6px 0; border-top: 1px dashed var(--line); font-size: 14px; }
  .t .err { color: var(--ng); font-size: 12px; white-space: pre-wrap; margin: 4px 0 0 22px; }
  iframe { width: 375px; height: 700px; border: 2px solid var(--line); border-radius: 16px; background: #fff; }
  details { margin-top: 12px; }
  .muted { color: var(--sub); font-size: 12px; }
  .code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--bg); border-radius: 6px; padding: 4px 8px; margin-top: 4px; overflow-x: auto; white-space: pre; }
</style>
</head>
<body>
<h1>🧪 家計簿アプリのテスト</h1>
<div id="summary">テスト中…</div>
<div class="group" id="coverage" hidden></div>
<div id="results"></div>
<details><summary>テスト中のアプリ画面</summary><iframe id="app"></iframe></details>
<!-- カバレッジを測るときに、プログラムを読みとる道具（acorn）を使う -->
<script src="https://cdn.jsdelivr.net/npm/acorn@8.12.1/dist/acorn.js"></script>
<script src="coverage.js"></script>
<script src="tests.js"></script>
</body>
</html>
